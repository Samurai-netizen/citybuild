# PostgreSQL for development (core-instructions/06-data-model.md): `docker compose up -d postgres` (docs/getting-started.md → Database).
# The credentials come from .env next to this file (gitignored; copy .env.example). Compose stops if one of them is missing.
services:
  postgres:
    # Pinned to the version the server is built and tested against (core-instructions/01-project-context.md).
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
    # Only this machine can connect; the API runs on the host (dotnet run) and uses localhost:5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # From PostgreSQL 18 the image keeps its data in /var/lib/postgresql/18/docker and declares /var/lib/postgresql as its volume, so the
    # volume goes there, not at /var/lib/postgresql/data (image docs on hub.docker.com/_/postgres, checked 2026-10-26).
    volumes:
      - postgres-data:/var/lib/postgresql
    # Healthy once the server accepts connections to the game database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

# The database files survive `docker compose down`; only `docker compose down -v` deletes them.
volumes:
  postgres-data:
