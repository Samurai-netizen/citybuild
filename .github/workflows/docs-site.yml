name: Handbook site

# Publishes the handbook (website/) to GitHub Pages after every merge to main (owner's decision, CR-0002).
# The same build runs on every pull request in the CI job `docs`, so a merged change has already passed it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # each page's "last updated" date comes from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the handbook
        run: bash scripts/dev/docs-site.sh build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
