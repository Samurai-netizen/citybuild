version: 2
updates:
  # Keeps CI actions current. Dependency updates are proposals: the owner decides (G-Dependency).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(repo)"
  # The handbook site's packages (website/). One group, so Docusaurus packages move together.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(repo)"
    groups:
      handbook-site:
        patterns: ["*"]
